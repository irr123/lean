name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.13.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - name: Install validator
        run: python -m pip install skills-ref==0.1.1
      - name: Validate skills
        run: |
          for skill in skills/*; do
            work=$(mktemp -d)/$(basename "$skill")
            cp -R "$skill" "$work"
            perl -ni -e 'print unless /^(disable-model-invocation|disallowed-tools|user-invocable):/' "$work/SKILL.md"
            agentskills validate "$work"
          done
      - name: Check discovery
        env:
          DISABLE_TELEMETRY: "1"
          NO_COLOR: "1"
        run: |
          output=$(npx --yes skills@1.5.20 add . --list)
          printf '%s\n' "$output"
          grep -q 'Found 3 skills' <<< "$output"
          for skill in lean-apply lean-research lean-transfer; do
            grep -q "$skill" <<< "$output"
          done
